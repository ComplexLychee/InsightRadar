# ==================== 站点信息 ====================
title: "Insight Radar"
title_separator: "|"
subtitle: "AI 论文追踪与洞察"
name: "ComplexLychee"
description: "追踪人工智能领域最新研究动态，每周一更新"
url: "https://complexlychee.github.io"
baseurl: "/InsightRadar"
repository: "ComplexLychee/InsightRadar"

# ==================== 主题配置 ====================
# GitHub Pages 不支持直接安装 gem 主题，必须用 remote_theme
remote_theme: mmistakes/minimal-mistakes

# ==================== 作者信息 ====================
author:
  name: "ComplexLychee"
  bio: "AI 研究者，关注大模型与系统可靠性。每周为你解读最新论文。"
  location: "China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ComplexLychee"

# ==================== 构建配置 ====================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-remote-theme    # ← 关键：支持远程主题
  - jekyll-include-cache

paginate: 10
paginate_path: /page:num/

# ==================== 默认布局 ====================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true

# ==================== 归档页面 ====================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
