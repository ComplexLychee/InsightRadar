# ==================== 站点信息 ====================
title: "Insight Radar"
title_separator: "|"
subtitle: "AI 论文追踪与洞察"
name: "ComplexLychee"
description: "追踪人工智能领域最新研究动态，每周一更新"
url: "https://complexlychee.github.io"
baseurl: "/InsightRadar"
repository: "ComplexLychee/InsightRadar"

# ==================== 主题配置 ====================
remote_theme: mmistakes/minimal-mistakes

# ==================== 作者信息（固定，后续勿改） ====================
author:
  name: "ComplexLychee"
  bio: "PhD in Mathematics and Statistics, Network Science; Currently working on silent data corruption (SDC) and research agents"
  location: "China"
  links:
    - label: "🔧 SDC 专栏"
      icon: "fas fa-fw fa-microchip"
      url: "/InsightRadar/columns/sdc/"
    - label: "🤖 Agents 专栏"
      icon: "fas fa-fw fa-robot"
      url: "/InsightRadar/columns/agents/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ComplexLychee"
    - label: "关于"
      icon: "fas fa-fw fa-info-circle"
      url: "/InsightRadar/about/"

# ==================== 构建配置 ====================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-include-cache

paginate: 10
paginate_path: /page:num/

include:
  - _pages

collections:
  pages:
    output: true
    permalink: /:path/

# ==================== 默认布局 ====================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true

# ==================== 归档页面 ====================
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
