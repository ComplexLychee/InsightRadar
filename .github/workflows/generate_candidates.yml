name: Generate Candidates

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      time_range:
        description: '时间范围（如：1 week, 1 month, 3 months, 1 year）'
        required: true
        default: '1 week'
        type: string
      keyword_preset:
        description: '关键词预设'
        required: true
        default: 'weekly_auto'
        type: choice
        options:
          - weekly_auto
          - sdc_reliability
          - research_agents
          - default
          - llm_only
          - vision_only
          - rl_only
          - all_areas
      custom_query:
        description: '【高级】自定义 arXiv 查询语句。如需使用上方预设，请务必留空！'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install arxiv requests pdfplumber
      - name: Generate candidates
        env:
          TIME_RANGE: ${{ github.event.inputs.time_range || '1 week' }}
          KEYWORD_PRESET: ${{ github.event.inputs.keyword_preset || 'weekly_auto' }}
          CUSTOM_QUERY: ${{ github.event.inputs.custom_query || '' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python scripts/generate_candidates.py
      - name: Commit candidates and logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates/ logs/
          git diff --cached --quiet || (git commit -m "📝 Add candidate pool & logs $(date +%Y-%m-%d-%H%M)" && git push)
