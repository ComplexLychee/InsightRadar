name: Publish Selected

on:
  workflow_dispatch:
    inputs:
      candidate_file:
        description: '指定候选文件名（如：2026-08-22-1430-candidates.md）。留空则使用最新。'
        required: false
        type: string
      merge_multiple:
        description: '合并多个文件发布？格式：file1.md,file2.md（留空则不合并）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jinja2 requests
      - name: Publish selected papers
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://complexlychee.github.io/InsightRadar' }}
          CANDIDATE_FILE: ${{ github.event.inputs.candidate_file || '' }}
          MERGE_MULTIPLE: ${{ github.event.inputs.merge_multiple || '' }}
        run: python scripts/publish_selected.py
      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --cached --quiet || (git commit -m "📰 Publish selected papers $(date +%Y-%m-%d)" && git push)
